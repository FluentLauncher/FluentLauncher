name: Windows release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: 'Build only, publish nightly, or bump and publish stable'
        type: choice
        options: [build, nightly, patch, minor, major]
        default: build
      signed:
        description: 'Build with signed updates (requires repository keys)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test release planning and publishing guards
        run: ./scripts/test-release.ps1
      - name: Plan release and generate notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || (github.event_name == 'push' && 'nightly' || inputs.action) }}
        run: ./scripts/prepare-release.ps1 -Action $env:RELEASE_ACTION -Tag $env:GITHUB_REF_NAME
      - name: Validate
        if: steps.release.outputs.skip != 'true'
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          go tool mygo vet .
          if ($LASTEXITCODE -ne 0) { throw 'mygo vet failed' }
          go tool mygo i18n check .
          if ($LASTEXITCODE -ne 0) { throw 'i18n check failed' }
      - name: Build portable EXE and signed updates
        if: steps.release.outputs.skip != 'true'
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY: ${{ vars.FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY }}
          FLUENTLAUNCHER_PLUGIN_REPOSITORY: ${{ vars.FLUENTLAUNCHER_PLUGIN_REPOSITORY }}
          SIGNED_BUILD: ${{ steps.release.outputs.publish == 'true' || inputs.signed }}
        run: |
          $plan = Get-Content -Raw build/release-plan.json | ConvertFrom-Json
          $notes = ''
          if ($plan.publish) { $notes = Join-Path $PWD 'build/update-changelog.md' }
          ./scripts/build-release.ps1 -Tag $plan.tag -NotesFile $notes -Signed:($env:SIGNED_BUILD -eq 'true')
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.skip != 'true'
        with:
          name: FluentLauncher-windows-x64
          path: build/release/windows-amd64/*
          if-no-files-found: error
      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
